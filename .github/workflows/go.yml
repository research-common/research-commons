# CI for the Go implementation (module at the repo root, `next` branch).
# Public repo: read-only token, no secrets, no pull_request_target, actions pinned by SHA.
name: go

# `main` still carries the alpha tool (no go.mod), so only the next-format line is built: `next` and the
# stacked `stage3/*` branches that PRs into `next` are based on.
on:
  pull_request:
    branches: [next, 'stage3/**']
  push:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  test-symlinked-tmpdir:
    # t.TempDir() under a symlinked TMPDIR (macOS: /var -> /private/var). Path
    # confinement must hold when the temp root is not a realpath.
    name: test (symlinked TMPDIR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test with TMPDIR behind a symlink
        run: |
          real="$(mktemp -d)"
          link="$(mktemp -u)-link"
          ln -s "$real" "$link"
          test "$(readlink "$link")" = "$real"
          TMPDIR="$link" go test ./...

  test-race:
    # The race detector on the packages that start goroutines (in code or tests): it reports only races
    # that happen while tests run, so a package whose tests never run code concurrently gains nothing,
    # and on the signature-heavy packages it costs 10-20x (over 10 minutes per package). The list is
    # computed, so a package that starts a goroutine joins the job without a workflow edit.
    name: test -race (packages that start goroutines)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: |
          # a go statement, or sync.WaitGroup.Go
          pkgs="$(grep -rlE --include='*.go' '(^|[^A-Za-z_.])go (func|[A-Za-z_][A-Za-z0-9_.]*\()|\.Go\(func' . \
            | xargs -r -n1 dirname | sort -u)"
          if [ -z "$pkgs" ]; then echo "no package starts a goroutine"; exit 0; fi
          echo "$pkgs"
          go test -race $pkgs

  static-build:
    name: static build (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 go build ./...

  test-sandbox-oci:
    # The OCI sandbox backend and `commons run` on it, against the runner's own docker. NOT a required check
    # (it needs a registry pull and the runner's container runtime, neither of which should gate a change);
    # the conformance scan still counts its tests as run (internal/conformance/ci-tags.txt, kept in step with
    # this job by a test). The image is pinned by digest and pulled here because the tests never pull; a test
    # OCI test that skips (no image, no runtime, no network control) fails the job, since a skip proves nothing.
    # The two packages run at the same time: each test labels its containers with a label of its own and checks for
    # leftovers by that label only.
    name: test (sandbox_oci)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RC_TEST_IMAGE: alpine@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: pull the pinned image
        run: |
          docker version
          docker pull "$RC_TEST_IMAGE"
      - name: run the tagged tests
        run: |
          set -o pipefail
          go test -count=1 -v -tags sandbox_oci ./internal/run/... ./internal/clirun/... | tee oci-test.log
          if grep -E '^\s*--- SKIP: TestOCI' oci-test.log; then
            echo "a sandbox_oci test skipped: the job proves nothing for it" >&2
            exit 1
          fi

  two-hub-drill:
    # RELEASING criterion 3, scripted: scripts/two-hub-drill.sh (two bare git repos as hubs, two stores,
    # two keys, no network) run by a Go test that builds the binary. NOT a required check. Also in
    # internal/conformance/ci-tags.txt, kept in step with this job by a test.
    name: two-hub drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: run the drill
        run: |
          set -o pipefail
          go test -count=1 -v -tags twohub -run TestTwoHubDrill ./cmd/commons/ | tee drill.log
          if grep -E '^\s*--- SKIP' drill.log; then
            echo "the drill skipped: the job proves nothing" >&2
            exit 1
          fi

  python:
    # The thin Python package in python/ (stdlib only) and its wheel builder. Not a required check: it
    # must never gate a Go change. Two legs: the oldest Python the package supports (requires-python
    # >=3.9, from a pinned setup-python) and the runner's own python3. setup-python ships no 3.9 build
    # for the newest Ubuntu image, so that leg runs on ubuntu-24.04. Go is for the tests that build a
    # real commons.
    name: python package (${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: runner
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: matrix.python != 'runner'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: python3 -m unittest
        working-directory: python
        run: |
          python3 --version
          python3 -m unittest -v
